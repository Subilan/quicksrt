# quicksrt 样式预设：每段一个命名预设（段名 = 预设名），字段与 [style] 一致。
# config.toml 的 [style] 中写 preset = "default" 即可引用；
# 预设为基底，[style] 中显式写的字段会覆盖预设对应字段。

[default]
# 中文字体与整体字号/边距
font_name = "Noto Sans CJK SC"
font_size_ratio = 0.05
margin_v_ratio = 0.05
primary_color = "&H00FFFFFF"
outline_color = "&H00000000"
outline = 2
shadow = 1
# 语言模式：bilingual（双语，主语言在上、副语言在下）| mono（单语，只显示主语言）
mode = "bilingual"
# 主语言（在上、大字号）：zh | en（en 时双语为英文在上、中文在下）
primary_lang = "zh"
# 中文样式（粗体/斜体）
font_bold = false
font_italic = false
# 英文独立字体与样式（英文做主/副语言均生效，字号跟随主/副位置）
en_font_name = "Noto Sans CJK SC"
en_font_ratio = 0.6
en_bold = false
en_italic = false
# 字幕背景：全宽半透明矩形条（分层渲染：背景 Dialogue + 文本 Dialogue）
# bg_color 为 ASS AABBGGRR 格式（&H80 前缀即 50% 透明）；bg_padding_ratio 为内边距相对字号比例
bg_enabled = false
bg_color = "&H80000000"
bg_padding_ratio = 0.35
