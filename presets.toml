[default]
# 中文字体与整体字号/边距
zh_font_name = "微软雅黑"
font_size_ratio = 0.05
margin_v_ratio = 0.05
zh_color = "#FFFFFF"
outline_color = "#000000"
outline = 2
shadow = 1
# 语言模式：bilingual（双语，主语言在上、副语言在下）| mono（单语，只显示主语言）
mode = "bilingual"
# 主语言（在上、大字号）：zh | en（en 时双语为英文在上、中文在下）
primary_lang = "zh"
# 中文假粗体/假斜体（不依赖字体变体；精确字重/斜体请填 zh_font_name 变体全名）
zh_bold = false
zh_italic = false
# 英文独立字体与样式（英文做主/副语言均生效，字号跟随主/副位置）
en_font_name = "微软雅黑"
en_font_ratio = 0.6
en_bold = false
en_italic = false
# 字幕背景：全宽半透明矩形条（分层渲染：背景 Dialogue + 文本 Dialogue）
# bg_color 为 CSS 颜色（如 rgba(0,0,0,0.5) 半透明黑，或 #00000080）；bg_padding_ratio 为内边距相对字号比例
bg_enabled = false
bg_color = "rgba(0, 0, 0, 0.5)"
bg_padding_ratio = 0.35

[plex]
# 中文字体与整体字号/边距
zh_font_name = "IBMPlexSansSC-Medm"
font_size_ratio = 0.05
margin_v_ratio = 0.05
zh_color = "#FFFFFF"
outline_color = "#000000"
outline = 2
shadow = 1
# 语言模式：bilingual（双语，主语言在上、副语言在下）| mono（单语，只显示主语言）
mode = "bilingual"
# 主语言（在上、大字号）：zh | en（en 时双语为英文在上、中文在下）
primary_lang = "zh"
# 中文假粗体（字体无真粗体变体时的合成加粗）
zh_bold = false
zh_italic = false
# 英文独立字体与样式：直接填斜体变体全名，精确使用真斜体
en_font_name = "IBM Plex Sans"
en_font_ratio = 0.6
en_bold = false
en_italic = true
# 英文独立颜色（CSS 颜色：rgb()/rgba()/#HEX）
en_color = "#2196F3"
# 字幕背景：全宽半透明矩形条（分层渲染：背景 Dialogue + 文本 Dialogue）
# bg_color 为 CSS 颜色（如 rgba(0,0,0,0.5) 半透明黑，或 #00000080）；bg_padding_ratio 为内边距相对字号比例
bg_enabled = false
bg_color = "rgba(0, 0, 0, 0.5)"
bg_padding_ratio = 0.35
