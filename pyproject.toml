[project]
name = "quicksrt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "oss2>=2.19.1",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "typer>=0.27.1",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
quicksrt = "quicksrt.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["quicksrt*"]
exclude = ["references*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
